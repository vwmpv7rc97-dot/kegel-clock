<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>提肛时钟</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="提肛时钟">
<meta name="theme-color" content="#f4f6f8">

<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #f4f6f8;
    --card: #ffffff;
    --text: #1e293b;
    --text-secondary: #64748b;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --accent-light: #eff6ff;
    --border: #e2e8f0;
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    --shadow-lg: 0 4px 16px rgba(0,0,0,0.06), 0 1px 4px rgba(0,0,0,0.04);
    --radius: 16px;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    padding-top: calc(20px + var(--safe-t));
    padding-bottom: calc(20px + var(--safe-b));
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ===== 主卡片 ===== */
  .card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow-lg);
    border: 1px solid var(--border);
    width: 100%;
    max-width: 520px;
    padding: 40px 36px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  .title {
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 0.15em;
    margin-bottom: 20px;
  }

  .time {
    font-size: 80px;
    font-weight: 300;
    color: var(--text);
    line-height: 1;
    letter-spacing: 0.04em;
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum";
  }

  .date {
    font-size: 15px;
    color: var(--text-secondary);
    margin-top: 8px;
    letter-spacing: 0.03em;
  }

  /* ===== 按钮行 ===== */
  .btn-row {
    display: flex;
    gap: 12px;
    margin-top: 32px;
    width: 100%;
  }

  .btn {
    flex: 1;
    padding: 14px 16px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    letter-spacing: 0.06em;
    font-family: inherit;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
    text-align: center;
    white-space: nowrap;
    min-height: 48px;
    -webkit-tap-highlight-color: transparent;
  }

  .btn:active {
    transform: scale(0.97);
    background: #f8fafc;
  }

  .btn-primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    font-weight: 600;
  }

  .btn-primary:active {
    background: var(--accent-hover);
    border-color: var(--accent-hover);
  }

  .btn-primary.disabled {
    background: #93c5fd;
    border-color: #93c5fd;
    cursor: default;
    pointer-events: none;
  }

  @media (hover: hover) {
    .btn:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
    }
    .btn-primary:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }
    .btn-primary.disabled:hover {
      background: #93c5fd;
      border-color: #93c5fd;
    }
  }

  /* ===== 运动 Overlay ===== */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(15,23,42,0.4);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }

  .overlay.active {
    opacity: 1;
    pointer-events: auto;
  }

  .exercise-card {
    background: var(--card);
    border-radius: 20px;
    padding: 36px 32px;
    text-align: center;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15);
  }

  .exercise-title {
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 4px;
  }

  .exercise-subtitle {
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 28px;
  }

  .progress-wrap {
    position: relative;
    width: 160px;
    height: 160px;
    margin: 0 auto 20px;
  }

  .progress-wrap svg {
    transform: rotate(-90deg);
    width: 100%;
    height: 100%;
  }

  .progress-wrap .bg {
    fill: none;
    stroke: #e2e8f0;
    stroke-width: 8;
  }

  .progress-wrap .fg {
    fill: none;
    stroke: var(--accent);
    stroke-width: 8;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.3s linear;
  }

  .progress-wrap .fg.relax {
    stroke: #60a5fa;
  }

  .countdown-num {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    font-weight: 300;
    color: var(--text);
  }

  .phase-label {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.1em;
    margin-bottom: 4px;
    transition: color 0.3s;
  }

  .phase-label.contract { color: #16a34a; }
  .phase-label.relax { color: #2563eb; }

  .phase-hint {
    font-size: 13px;
    color: var(--text-secondary);
    margin: 10px 0;
  }

  .cycle-dots {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 16px;
  }

  .cycle-dots span {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #e2e8f0;
    transition: all 0.3s;
  }

  .cycle-dots span.done { background: #93c5fd; }
  .cycle-dots span.current { background: var(--accent); transform: scale(1.4); }

  .btn-skip {
    padding: 10px 24px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text-secondary);
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: 0.05em;
  }

  .btn-skip:active { background: #f8fafc; }

  /* ===== Toast ===== */
  .toast {
    position: fixed;
    top: 60px;
    left: 50%;
    transform: translateX(-50%) translateY(-120px);
    background: #1e293b;
    color: #fff;
    padding: 12px 24px;
    border-radius: 12px;
    font-size: 14px;
    letter-spacing: 0.05em;
    box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 300;
    text-align: center;
    max-width: 90vw;
  }

  .toast.show {
    transform: translateX(-50%) translateY(0);
  }

  /* ===== 响应式 ===== */

  /* 手机竖屏：按钮堆叠 + 卡片撑满 */
  @media (max-width: 500px) {
    body { padding: 16px; padding-top: calc(16px + var(--safe-t)); padding-bottom: calc(16px + var(--safe-b)); align-items: stretch; }
    .card { flex: 1; max-width: none; padding: 32px 24px; justify-content: center; border-radius: 20px; }
    .time { font-size: 56px; }
    .title { font-size: 18px; margin-bottom: 24px; }
    .btn-row { flex-direction: column; gap: 10px; margin-top: 28px; }
    .btn { flex: none; width: 100%; }
    .date { font-size: 14px; }
    .exercise-card { padding: 28px 24px; }
    .progress-wrap { width: 130px; height: 130px; }
    .countdown-num { font-size: 40px; }
    .phase-label { font-size: 19px; }
  }

  /* 平板竖屏 */
  @media (min-width: 501px) and (max-width: 900px) {
    .time { font-size: 72px; }
    .card { max-width: 480px; }
  }

  /* 桌面横屏 */
  @media (min-width: 901px) {
    body { align-items: center; }
    .card { max-width: 560px; padding: 48px 48px; }
    .time { font-size: 96px; }
  }
</style>
</head>
<body>

<div class="card" id="mainCard">
  <div class="title">提 肛 时 钟</div>
  <div class="time" id="clockTime">00:00:00</div>
  <div class="date" id="clockDate"></div>
  <div class="btn-row">
    <button class="btn" id="btnNotify" onclick="handleNotify()">🔔 开启通知</button>
    <button class="btn btn-primary" id="btnCycle" onclick="handleCycle()">▶ 开始计时</button>
    <button class="btn" id="btnNow" onclick="handleNow()">⚡ 立即开提</button>
  </div>
</div>

<!-- 运动 Overlay -->
<div class="overlay" id="overlay">
  <div class="exercise-card">
    <div class="exercise-title">🏋️ 提肛运动</div>
    <div class="exercise-subtitle">60 秒 · 守护健康</div>

    <div class="progress-wrap">
      <svg viewBox="0 0 200 200">
        <circle class="bg" cx="100" cy="100" r="90"/>
        <circle class="fg" id="progFg" cx="100" cy="100" r="90" stroke-dasharray="565.49" stroke-dashoffset="0"/>
      </svg>
      <div class="countdown-num" id="countdownNum">60</div>
    </div>

    <div class="phase-label contract" id="phaseLabel">收 缩</div>
    <div class="phase-hint" id="phaseHint">第 1 / 3 轮</div>

    <div class="cycle-dots" id="cycleDots">
      <span class="current"></span><span></span><span></span>
    </div>

    <button class="btn-skip" onclick="skipExercise()">跳过</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===== 状态 =====
let phaseTimer = null;
let notifOk = false;
let cycleActive = false;
let nextTrigger = null;
let lastDay = null;
let wakeLock = null;

// ===== 通知 =====
function checkNotifState() {
  if ('Notification' in window) {
    if (Notification.permission === 'granted') {
      notifOk = true;
      document.getElementById('btnNotify').textContent = '✅ 已开启';
    } else if (Notification.permission === 'denied') {
      notifOk = false;
      document.getElementById('btnNotify').textContent = '⚠️ 已拒绝';
    }
  } else {
    document.getElementById('btnNotify').textContent = '⛔ 不支持';
    document.getElementById('btnNotify').disabled = true;
  }
}

async function handleNotify() {
  if (!('Notification' in window)) { toast('当前浏览器不支持通知'); return; }
  if (Notification.permission === 'granted') { notifOk = true; toast('通知已开启 ✅'); updateNotifyBtn(); return; }
  if (Notification.permission === 'denied') { toast('通知权限已被拒绝，请在浏览器设置中修改'); return; }
  try {
    const p = await Notification.requestPermission();
    notifOk = (p === 'granted');
    if (notifOk) { toast('通知已开启 ✅'); new Notification('提肛时钟', { body: '已就绪，会按时提醒你' }); }
    else { toast('通知权限未获取，页面内提醒仍然有效'); }
    updateNotifyBtn();
  } catch (e) { toast('通知授权失败'); }
}

function updateNotifyBtn() {
  const b = document.getElementById('btnNotify');
  if (notifOk) { b.textContent = '✅ 已开启'; }
  else if (Notification.permission === 'denied') { b.textContent = '⚠️ 已拒绝'; }
  else { b.textContent = '🔔 开启通知'; }
}

function sendNotif(title, body) {
  if (notifOk) {
    try {
      if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
        navigator.serviceWorker.ready.then(r => r.showNotification(title, { body, tag: 'kegel', requireInteraction: true, vibrate: [200,100,200] }));
      } else {
        new Notification(title, { body, tag: 'kegel', requireInteraction: true });
      }
      return;
    } catch (e) {}
  }
  toast(`⏰ ${title}\n${body}`);
}

// ===== Toast =====
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._tid);
  t._tid = setTimeout(() => t.classList.remove('show'), 3000);
}

// ===== 音频 =====
let audioCtx = null;
function initAudio() { if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } }
function ensureAudio() { if (!audioCtx) initAudio(); if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); }

function beep(f, d, type) {
  ensureAudio();
  if (!audioCtx) return;
  try {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type || 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0.25, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + d);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + d);
  } catch (e) {}
}

function beepContract() { beep(660, 0.12, 'square'); if ('vibrate' in navigator) navigator.vibrate(80); }
function beepRelax() { beep(1040, 0.18, 'sine'); if ('vibrate' in navigator) navigator.vibrate([40,30,40]); }
function beepDone() { beep(1320,0.1); setTimeout(()=>beep(1560,0.12),120); setTimeout(()=>beep(1760,0.2),280); if ('vibrate' in navigator) navigator.vibrate([80,40,80,40,150]); }

// ===== 时钟 =====
function updateClock() {
  const now = new Date();
  document.getElementById('clockTime').textContent =
    `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;

  const wd = ['日','一','二','三','四','五','六'];
  document.getElementById('clockDate').textContent =
    `${now.getFullYear()}年${String(now.getMonth()+1).padStart(2,'0')}月${String(now.getDate()).padStart(2,'0')}日 星期${wd[now.getDay()]}`;

  // 每日重置
  const today = now.getDate();
  if (lastDay !== null && lastDay !== today) { cycleActive = false; nextTrigger = null; updateCycleBtn(); }
  lastDay = today;

  // 60分钟周期触发
  if (cycleActive && nextTrigger && Date.now() >= nextTrigger) {
    nextTrigger += 60 * 60 * 1000;
    startExercise();
  }
}

// ===== 按钮：开始计时 =====
function handleCycle() {
  if (!notifOk) { toast('请先开启通知权限'); handleNotify(); return; }
  if (cycleActive) {
    cycleActive = false; nextTrigger = null;
    toast('计时已停止 ⏸️');
  } else {
    cycleActive = true;
    nextTrigger = Date.now() + 60 * 60 * 1000;
    lastDay = new Date().getDate();
    const nt = new Date(nextTrigger);
    toast(`计时开始！首次提醒 ${String(nt.getHours()).padStart(2,'0')}:${String(nt.getMinutes()).padStart(2,'0')}`);
  }
  updateCycleBtn();
}

function updateCycleBtn() {
  const b = document.getElementById('btnCycle');
  if (cycleActive) { b.textContent = '⏸ 计时中'; b.classList.add('disabled'); }
  else { b.textContent = '▶ 开始计时'; b.classList.remove('disabled'); }
}

// ===== 按钮：立即开提 =====
function handleNow() {
  if (!notifOk) { toast('请先开启通知权限'); handleNotify(); return; }
  startExercise();
}

// ===== 运动 =====
const CIRC = 2 * Math.PI * 90;

function startExercise() {
  if (phaseTimer !== null) return;

  const overlay = document.getElementById('overlay');
  const fg = document.getElementById('progFg');
  const cn = document.getElementById('countdownNum');
  const pl = document.getElementById('phaseLabel');
  const ph = document.getElementById('phaseHint');
  const cd = document.getElementById('cycleDots');

  overlay.classList.add('active');
  fg.classList.remove('relax');
  fg.setAttribute('stroke-dashoffset', '0');
  cn.textContent = '60';

  sendNotif('提肛时间', '该起来提肛啦！');

  if ('wakeLock' in navigator) {
    navigator.wakeLock.request('screen').then(w => { wakeLock = w; w.addEventListener('release', () => wakeLock = null); }).catch(()=>{});
  }

  // 标题闪烁
  const origTitle = document.title;
  let flashOn = true;
  const flashId = setInterval(() => { document.title = flashOn ? '⏰ 提肛！' : origTitle; flashOn = !flashOn; }, 800);

  const phases = [
    { l:'收 缩', c:'contract', ct:true,  h:'第 1 / 3 轮' },
    { l:'放 松', c:'relax',    ct:false, h:'第 1 / 3 轮' },
    { l:'收 缩', c:'contract', ct:true,  h:'第 2 / 3 轮' },
    { l:'放 松', c:'relax',    ct:false, h:'第 2 / 3 轮' },
    { l:'收 缩', c:'contract', ct:true,  h:'第 3 / 3 轮' },
    { l:'放 松', c:'relax',    ct:false, h:'第 3 / 3 轮' },
  ];

  const startTs = Date.now();

  function updDots(idx) {
    const done = Math.floor(idx / 2);
    const dots = cd.querySelectorAll('span');
    dots.forEach((d, i) => { d.className = ''; if (i < done) d.className = 'done'; if (i === done && idx % 2 === 0) d.className = 'current'; if (i === done && idx % 2 === 1) d.className = 'done'; });
  }

  function runPhase(idx) {
    if (idx >= phases.length) { finish(); return; }
    const p = phases[idx];
    pl.textContent = p.l; pl.className = 'phase-label ' + p.c;
    ph.textContent = p.h; updDots(idx);
    fg.classList.toggle('relax', !p.ct);
    (p.ct ? beepContract : beepRelax)();

    const phaseStart = Date.now();
    fg.setAttribute('stroke-dashoffset', '0');

    function tick() {
      const remaining = Math.max(0, 10 - (Date.now() - phaseStart) / 1000);
      const gRemain = Math.max(0, 60 - (Date.now() - startTs) / 1000);
      cn.textContent = String(Math.ceil(gRemain));
      fg.setAttribute('stroke-dashoffset', CIRC - (remaining / 10) * CIRC);
      if (remaining <= 0) { clearInterval(phaseTimer); runPhase(idx + 1); }
    }
    tick();
    phaseTimer = setInterval(tick, 100);
  }

  function finish() {
    clearInterval(phaseTimer); phaseTimer = null;
    clearInterval(flashId); document.title = origTitle;
    beepDone();
    if (wakeLock) { wakeLock.release().catch(()=>{}); wakeLock = null; }
    overlay.classList.remove('active');
    toast('✅ 完成！下一轮继续加油');
  }

  updDots(-1);
  runPhase(0);
}

function skipExercise() {
  if (phaseTimer) { clearInterval(phaseTimer); phaseTimer = null; }
  if (wakeLock) { wakeLock.release().catch(()=>{}); wakeLock = null; }
  document.getElementById('overlay').classList.remove('active');
  document.title = '提肛时钟';
}

// ===== 启动 =====
function init() {
  lastDay = new Date().getDate();
  checkNotifState();
  updateClock();
  setInterval(updateClock, 1000);

  // 点击激活音频
  document.addEventListener('click', () => { initAudio(); if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); }, { once: false });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) updateClock(); });
}

// ===== Service Worker =====
if ('serviceWorker' in navigator) {
  const swBlob = new Blob([`
    const C = 'kegel-v3';
    self.addEventListener('install', e => { e.waitUntil(caches.open(C).then(c => c.addAll([self.location.href])).catch(()=>{})); self.skipWaiting(); });
    self.addEventListener('activate', e => { e.waitUntil(caches.keys().then(k => Promise.all(k.filter(x => x !== C).map(x => caches.delete(x))))); self.clients.claim(); });
    self.addEventListener('fetch', e => { e.respondWith(caches.match(e.request).then(r => r || fetch(e.request))); });
    self.addEventListener('notificationclick', e => { e.notification.close(); e.waitUntil(clients.matchAll({type:'window',includeUncontrolled:true}).then(w => w.length ? w[0].focus() : clients.openWindow(self.location.href))); });
  `], { type: 'application/javascript' });
  navigator.serviceWorker.register(URL.createObjectURL(swBlob), { scope: '/' }).catch(() => {});
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
